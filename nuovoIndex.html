<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaBot Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --panel: #1a1f2e;
      --panel2: #141824;
      --accent: #00e5ff;
      --accent2: #ff4081;
      --btn: #222840;
      --btn-border: #2e3a5c;
      --btn-active: #2a3560;
      --text: #c8d8f0;
      --muted: #5a6a8a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Exo 2', sans-serif;
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .root {
      background: var(--panel2);
      border-radius: 24px;
      border: 1px solid #2a3450;
      padding: 28px 24px 24px;
      width: 420px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status {
      margin-left: auto;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .status span { color: #4cff91; }

    .dpad-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .dpad {
      display: grid;
      grid-template-areas:
        ". up ."
        "left center right"
        ". down .";
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 4px;
    }

    .dpad-btn {
      background: var(--btn);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background .12s, border-color .12s, transform .1s;
      font-size: 11px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: .5px;
    }

    .dpad-btn:hover { background: var(--btn-active); border-color: var(--accent); }
    .dpad-btn:active { transform: scale(.93); background: #1e2a4a; }

    .dpad-btn svg {
      width: 20px; height: 20px;
      stroke: var(--accent); fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    .dpad-btn[data-cmd="forward"]  { grid-area: up; }
    .dpad-btn[data-cmd="backward"] { grid-area: down; }
    .dpad-btn[data-cmd="left"]     { grid-area: left; }
    .dpad-btn[data-cmd="right"]    { grid-area: right; }

    .center-btn {
      grid-area: center;
      background: #2a1020;
      border: 1px solid #5a1a30;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: background .12s, transform .1s;
      font-size: 10px;
      font-family: 'Share Tech Mono', monospace;
      color: var(--accent2);
      letter-spacing: .5px;
    }
    .center-btn:hover { background: #3a1828; border-color: var(--accent2); }
    .center-btn:active { transform: scale(.92); }
    .center-btn svg {
      width: 18px; height: 18px;
      stroke: var(--accent2); fill: none;
      stroke-width: 2.2; stroke-linecap: round;
    }

    .side-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rot-btn {
      background: var(--btn);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      width: 64px;
      height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: .5px;
      transition: background .12s, border-color .12s, transform .1s;
    }
    .rot-btn:hover { background: var(--btn-active); border-color: #a855f7; }
    .rot-btn:active { transform: scale(.93); }
    .rot-btn svg {
      width: 20px; height: 20px;
      stroke: #c084fc; fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    .log {
      background: #0d1117;
      border: 1px solid #1e2a40;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      letter-spacing: .5px;
      height: 36px;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
    }
    .log::before {
      content: '> ';
      color: var(--muted);
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="root">
    <div class="header">
      <div class="dot"></div>
      <div class="title">AlphaBot Control</div>
      <div class="status">LINK <span>●</span></div>
    </div>

    <form action="/result" method="POST" id="ctrlForm">
      <input type="hidden" name="bottone" id="cmdInput" value="">

      <div class="dpad-area">
        <div class="side-btns">
          <button type="button" class="rot-btn" data-cmd="90l" title="Sinistra 90°">
            <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
            90L
          </button>
        </div>

        <div class="dpad">
          <button type="button" class="dpad-btn" data-cmd="forward">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            AV
          </button>
          <button type="button" class="dpad-btn" data-cmd="left">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            SX
          </button>
          <button type="button" class="center-btn" data-cmd="stop">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            STOP
          </button>
          <button type="button" class="dpad-btn" data-cmd="right">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            DX
          </button>
          <button type="button" class="dpad-btn" data-cmd="backward">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            IN
          </button>
        </div>

        <div class="side-btns">
          <button type="button" class="rot-btn" data-cmd="90r" title="Destra 90°">
            <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
            90R
          </button>
        </div>
      </div>
    </form>

    <div class="log" id="log">in attesa di comando...</div>
  </div>

  <script>
    const labels = {
      forward: 'AVANTI', backward: 'INDIETRO',
      left: 'SINISTRA', right: 'DESTRA', stop: 'STOP',
      '90l': 'ROTAZIONE SX 90°', '90r': 'ROTAZIONE DX 90°'
    };
    const values = {
      forward: 'av', backward: 'in', left: 'si', right: 'dr',
      stop: 's', '90l': '90l', '90r': '90r'
    };

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cmd = btn.dataset.cmd;
        document.getElementById('log').textContent = labels[cmd];
        document.getElementById('cmdInput').value = values[cmd];
        document.getElementById('ctrlForm').submit();
      });
    });
  </script>
</body>
</html>
